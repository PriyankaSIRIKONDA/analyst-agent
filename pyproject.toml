[project]
name = "analyst-agent"
version = "0.1.0"
description = "A tool-calling SQL analyst agent with an evaluation harness"
requires-python = ">=3.10"

[project.scripts]
analyst-agent-mcp = "analyst_agent.mcp_server:main"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "eval", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "eval"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
